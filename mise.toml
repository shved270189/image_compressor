[tools]
python = "3.14.6"
node = "24.18.1"
uv = "0.12.9"
ruby = "4.0.5"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}/bin/python", tools = true }

[settings]
jobs = 2

[tasks.setup]
run = [
  "uv sync --locked",
  "npm --prefix frontend ci --include=dev",
  "bundle install",
]

[tasks.dev]
depends = ["dev:backend", "dev:frontend"]

[tasks."dev:backend"]
run = "uv run uvicorn backend.main:app --reload --reload-dir backend --port 8000"

[tasks."dev:frontend"]
run = "npm --prefix frontend run dev -- --port 5173 --strictPort"
