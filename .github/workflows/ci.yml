name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run setup
        env:
          BUNDLE_FROZEN: "true"
      - run: npm --prefix frontend run build
      - run: uv run pytest
      - run: uv run ruff check .
      - run: npm --prefix frontend run lint
      - run: bundle check && bundle exec kamal version
      - run: git diff --exit-code -- uv.lock frontend/package-lock.json Gemfile.lock
      - run: docker build -t image-compressor:smoke .
      - name: Container smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name image-compressor-smoke -p 127.0.0.1:8000:8000 image-compressor:smoke
          trap 'docker logs image-compressor-smoke; docker stop image-compressor-smoke' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/api/health
          SMOKE_BASE_URL=http://127.0.0.1:8000 uv run pytest
